<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Payment Success - World Net Hosting</title><link href="assets/css/style.css" rel="stylesheet"/></head><body><header class="top-nav"><a class="logo" href="index.html"><img alt="World Net Hosting logo" class="site-logo" src="images/logo1.jpeg"/><span class="site-brand-name">WNH</span></a><button aria-expanded="false" aria-label="Open navigation menu" class="nav-toggle" type="button"><span class="nav-toggle-icon">☰</span><span class="nav-toggle-label">Menu</span></button><div class="nav-left"><details class="nav-dropdown"><summary class="nav-item">Domains <span>⌄</span></summary><div class="dropdown-menu"><a href="domains.html">Domain Search</a><a href="dns-manager.html">DNS Manager</a><a href="domain-transfer.html">Transfer Domain</a><a href="domain-receive.html">Receive Domain</a><a href="reviews.html">Reviews</a><a href="deals.html">Deals</a><a href="security.html">Security</a><a href="terms.html">Terms and Conditions</a><a href="policy.html">Policy</a><a href="help.html">Help</a></div></details><a class="nav-item" href="email.html">Email</a><a class="nav-item" href="banking.html">Banking</a><a class="nav-item" href="pricing.html">Pricing</a><a class="nav-item" href="about.html">About</a><a class="nav-item" href="contact.html">Contact</a><a class="nav-item" href="ai-builder.html">AI Builder</a><a class="nav-item public-service-link" href="reseller-api.html">Reseller API</a></div><div class="nav-right"><a class="nav-item nav-auth-link" href="signin.html">Joinfree</a><a aria-label="Cart" class="cart" data-count="0" href="cart.html">🛒</a></div></header><main class="section"><div class="card" style="max-width:760px;margin:auto"><h1>Payment Confirmation</h1><p class="small">We are checking your Paystack payment reference.</p><div class="notice" id="payment-status">Verifying payment...</div><p style="margin-top:18px"><a class="btn teal" href="dashboard.html">Open Dashboard</a></p></div></main><script defer="" src="assets/js/env.js"></script><script defer="" src="assets/js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const out=document.getElementById('payment-status');const ref=new URLSearchParams(location.search).get('reference');if(!ref){out.textContent='No payment reference found. Open your dashboard or contact support.';return;}try{const res=await fetch(`${API_BASE}/payments/paystack/verify/${encodeURIComponent(ref)}`);const data=await readApiResponse(res);if(!res.ok)throw new Error(data.message||`Verification failed (${res.status})`);if(data?.data?.status==='success'){localStorage.removeItem('world_net_hosting_cart');localStorage.removeItem('worldnet_pending_payment');out.textContent='Payment verified successfully. Your payment has been confirmed and your account is being updated.';setTimeout(()=>{const target=sessionStorage.getItem('worldnet_payment_return')||sessionStorage.getItem('worldnet_return_to')||'dashboard.html';sessionStorage.removeItem('worldnet_payment_return');if(getToken()){location.replace(target)}else{sessionStorage.setItem('worldnet_return_to',target);location.replace('signin.html')}},1800)}else{out.textContent='Payment verification returned: '+(data?.data?.status||data?.message||'unknown');}}catch(e){out.textContent='Could not verify payment. Check backend and Paystack environment.';}})</script><script defer="" src="assets/js/language-switcher.js"></script></body></html>

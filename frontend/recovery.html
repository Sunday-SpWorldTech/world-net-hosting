<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>World Net Hosting - Account Recovery</title><link href="assets/css/style.css" rel="stylesheet"/></head><body><header class="top-nav"><a class="logo" href="index.html"><img alt="World Net Hosting logo" class="site-logo" src="images/logo1.jpeg"/><span class="site-brand-name">WNH</span></a><div class="nav-left"><a class="nav-item" href="banking.html">Banking</a><a class="nav-item" href="pricing.html">Pricing</a><a class="nav-item public-service-link" href="ai-builder.html">AI Builder</a><a class="nav-item public-service-link" href="reseller-api.html">Reseller API</a></div><div class="nav-right"><a class="nav-item" href="signin.html">Joinfree</a></div></header><section class="section auth-section auth-centered"><div class="card auth-card"><h2>Recover Your Account</h2><p class="small">Use your existing PIN to reset your password, or use your current password to reset your PIN.</p><h3>Reset Password</h3><form class="form" data-recovery="password"><input name="email" placeholder="Email address" required="" type="email"/><div class="password-field"><input id="recovery-pin" inputmode="numeric" maxlength="6" name="pin" pattern="[0-9]{4,6}" placeholder="Current PIN" required="" type="password"/><button class="password-toggle" data-password-toggle="recovery-pin" type="button">Show</button></div><div class="password-field"><input id="recovery-password" minlength="6" name="newPassword" placeholder="New password" required="" type="password"/><button class="password-toggle" data-password-toggle="recovery-password" type="button">Show</button></div><button class="btn teal" type="submit">Reset Password</button></form><hr/><h3>Reset PIN</h3><form class="form" data-recovery="pin"><input name="email" placeholder="Email address" required="" type="email"/><div class="password-field"><input id="recovery-current-password" name="password" placeholder="Current password" required="" type="password"/><button class="password-toggle" data-password-toggle="recovery-current-password" type="button">Show</button></div><div class="password-field"><input id="recovery-new-pin" inputmode="numeric" maxlength="6" name="newPin" pattern="[0-9]{4,6}" placeholder="New 4–6 digit PIN" required="" type="password"/><button class="password-toggle" data-password-toggle="recovery-new-pin" type="button">Show</button></div><button class="btn teal" type="submit">Reset PIN</button></form><div class="notice" id="auth-status" style="display:none"></div><p class="small auth-switch"><a href="signin.html">Return to sign in</a></p></div></section><script defer="" src="assets/js/env.js"></script><script defer="" src="assets/js/app.js"></script><script defer="" src="assets/js/language-switcher.js"></script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send | WNH Banking</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/dashboard.css"><style>
:root{--text:#10253e;--muted:#5f738d;--line:rgba(35,77,122,.12);--primary:#1f7cff;--success:#19b36b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:#f5f9ff}main{max-width:1000px;margin:auto;padding:28px 18px 60px}.head,.card{background:white;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 45px rgba(28,66,112,.11)}.head{padding:22px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:16px}.head h1{margin:0}.head p{margin:6px 0 0;color:var(--muted)}.back{color:white;background:linear-gradient(135deg,var(--success),var(--primary));padding:12px 16px;border-radius:12px;text-decoration:none;font-weight:800}.card{padding:26px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:750;font-size:.82rem;margin-bottom:7px}input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 13px;font:inherit;background:#f8fbff}textarea{padding:12px;min-height:90px}button{border:0;color:white;background:linear-gradient(135deg,var(--success),var(--primary));padding:13px 20px;border-radius:12px;font-weight:850;cursor:pointer}button:disabled{opacity:.55}.status{margin-top:14px;color:var(--muted);font-weight:700}.notice{padding:14px;border-radius:12px;background:#eef7ff;margin-bottom:18px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}}.wallet-action-page .top-nav .site-logo{width:34px!important;height:34px!important;max-width:34px!important;max-height:34px!important;object-fit:cover!important}.wallet-action-page .top-nav .logo{display:flex!important;align-items:center!important;gap:10px!important}.wallet-action-page .top-nav .site-brand-name{font-size:15px!important}@media(max-width:760px){.wallet-action-page .top-nav .site-logo{width:30px!important;height:30px!important;max-width:30px!important;max-height:30px!important}}</style><script src="assets/js/env.js"></script><link rel="stylesheet" href="assets/css/dashboard-fix.css"></head><body class="dashboard-body wallet-action-page"><div class="app-shell"><aside class="app-sidebar" aria-label="Account dashboard navigation"><a class="app-brand" href="reseller-dashboard.html"><img src="images/logo1.jpeg" alt="World Net Hosting logo"><span class="app-brand-copy"><strong>WNH</strong><small>Account Portal</small></span></a><div class="app-nav-viewport"><nav class="app-nav"><a class="active" href="dashboard-wallet.html">WNH Bank</a><a href="dashboard-register-domain.html">Register Domain</a><a href="dashboard-dns-manager.html">DNS Manager</a><a href="dashboard-business-email.html">Business Email</a><a href="dashboard-transfer-domain.html">Transfer Domain</a><a href="dashboard-receive-domain.html">Receive Domain</a><a href="reseller-dashboard.html">Overview</a><a href="ai-builder.html?dashboard=reseller">AI Builder</a><a href="dashboard-support.html">Support</a><a href="reseller-bank-api.html">Banking API KEY's</a><a href="reseller-domain-api.html">Domain Reseller API KEY's</a></nav></div><button class="app-logout" type="button">Logout</button></aside><section class="app-main"><header class="app-topbar"><div><p class="app-kicker">Account control center</p><h1>Send</h1></div><div class="app-top-actions"><a class="icon-button" href="dashboard-cart.html" aria-label="Cart">🛒</a><button class="profile-chip" type="button" onclick="logoutUser()">My Account</button></div></header><main><header class="head"><div><h1>Send</h1><p>Send funds to another registered WNH wallet.</p></div><a class="back" href="dashboard-wallet.html">← Banking</a></header><section class="card"><div id="roleNotice" class="notice">Loading secure Banking account…</div><form id="form"><div class="grid"><div><label>Recipient email</label><input name="recipientEmail" type="email" required></div><div><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>Currency</label><select name="currency"><option>NGN</option><option>USD</option><option>GHS</option><option>KES</option><option>ZAR</option><option>GBP</option><option>EUR</option></select></div><div class="full"><label>Note</label><textarea name="note"></textarea></div><div class="full"><button>Send Funds</button></div></div></form><div id="status" class="status"></div></section></main></section></div><script>
const API=String(window.WORLDNET_CONFIG?.API_BASE_URL||window.WORLDNET_API_BASE||'/api').replace(/\/$/,'');const token=localStorage.getItem('worldnet_token')||localStorage.getItem('worldnet_admin_token');const status=document.getElementById('status');function headers(json=true){const h={Authorization:`Bearer ${token||''}`};if(json)h['Content-Type']='application/json';return h}async function api(path,opt={}){let r,lastError;for(let attempt=0;attempt<3;attempt++){try{r=await fetch(API+path,{cache:'no-store',...opt});break}catch(e){lastError=e;if(attempt<2)await new Promise(resolve=>setTimeout(resolve,900*(attempt+1)));}}if(!r){throw new Error('Banking could not reach the backend. Confirm the backend is online and sign in again.')}const ct=String(r.headers.get('content-type')||'').toLowerCase();const raw=await r.text();let d={};if(raw&&ct.includes('application/json')){try{d=JSON.parse(raw)}catch{throw new Error(`Backend returned invalid JSON (${r.status}).`)}}else if(raw){d={message:raw.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()}}if(r.status===401){localStorage.removeItem('worldnet_token');localStorage.removeItem('worldnet_admin_token');sessionStorage.setItem('worldnet_return_to',location.pathname.split('/').pop());location.href='reseller-signin.html';throw new Error('Session expired. Sign in again.')}if(!r.ok)throw new Error(d.message||`Request failed (${r.status})`);return d}async function init(){if(!token){location.href='reseller-signin.html';return}try{const w=await api('/wallet',{headers:headers(false)});document.getElementById('roleNotice').textContent=`${w.user?.role||'user'} wallet · Available: ${new Intl.NumberFormat(undefined,{style:'currency',currency:w.currency||'NGN'}).format(Number(w.balance||0))}`;if(w.user?.role==='admin'&&'send'!=='deposit'){status.textContent='This customer wallet action is restricted for the administrator role.';document.querySelector('form')?.querySelectorAll('input,select,textarea,button').forEach(x=>x.disabled=true)}}catch(e){status.textContent=e.message}}init();document.getElementById('form').onsubmit=async e=>{e.preventDefault();status.textContent='Sending…';try{const b=Object.fromEntries(new FormData(e.target));b.amount=Number(b.amount);const d=await api('/wallet/send',{method:'POST',headers:headers(),body:JSON.stringify(b)});status.textContent=d.message;e.target.reset()}catch(x){status.textContent=x.message}};</script>
